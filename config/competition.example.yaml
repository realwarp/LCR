# The Liar's Chatroom - Competition Configuration Template
# Copy this file to config/competition.yaml and fill in the actual values
# before running any scripts.

# Competition and data settings
competition:
  name: "liars-chatroom-starter"
  description: "Synergy '26 Competition at IIIT Bangalore"

# File paths
data:
  # Raw data paths (official Kaggle files)
  raw:
    train: "data/raw/train.csv"
    test: "data/raw/test.csv"
    evidence: "data/raw/evidence.csv"
    sample_submission: "data/raw/sample_submission.csv"
  
  # Processed data output
  processed:
    train: "data/processed/train_processed.csv"
    test: "data/processed/test_processed.csv"
    validation: "data/processed/validation.csv"
  
  # Model outputs
  models:
    directory: "models"
    baseline: "models/baseline_model.pkl"
    best_model: "models/best_model.pkl"

# Training configuration
training:
  # Random seed for reproducibility
  seed: 42
  
  # Validation strategy
  validation:
    # Split ratio for train/validation
    test_size: 0.2
    
    # Stratification column (label column)
    stratify_by: "label"
    
    # Group-aware splitting to prevent conversation leakage
    group_by: "conversation_id"
    group_aware: true
  
  # Features to use from the data
  features:
    text_columns: ["utterance", "evidence"]
    categorical_columns: ["character", "conversation_id"]
    
    # Text processing
    text:
      max_features: 10000
      ngram_range: [1, 2]
      strip_accents: "unicode"
      lowercase: true
      stop_words: "english"
    
    # TF-IDF parameters
    tfidf:
      use_idf: true
      smooth_idf: true
      sublinear_tf: true
  
  # Model hyperparameters (default baseline)
  model:
    name: "logistic_regression"
    hyperparameters:
      C: 1.0
      max_iter: 1000
      solver: "lbfgs"
      class_weight: "balanced"
      random_state: 42
  
  # Comparison models to evaluate
  comparison_models:
    - name: "logistic_regression"
      params:
        C: [0.1, 1.0, 10.0]
        solver: ["lbfgs", "liblinear"]
    - name: "linear_svm"
      params:
        C: [0.1, 1.0, 10.0]
    - name: "random_forest"
      params:
        n_estimators: [100, 200]
        max_depth: [10, 20, None]

# Prediction settings
prediction:
  output:
    submission_file: "submissions/submission.csv"
    submission_template: "data/raw/sample_submission.csv"
  
  # Post-processing
  probability_threshold: 0.5
  ensemble: false

# Logging and reporting
logging:
  experiment_log: "reports/experiment_log.md"
  verbose: true
  
  # Metrics to track
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"

# Resources
resources:
  cpu_threads: 4
  max_memory_gb: 8
